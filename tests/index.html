<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Automated Test Runner - Checkpoint Engine</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; background: #0f172a; color: #f8fafc; padding: 2rem; }
    h1 { color: #818cf8; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1.5rem; margin-top: 1rem; }
    pre { background: #020617; padding: 1rem; border-radius: 6px; color: #38bdf8; overflow-x: auto; }
    .badge { display: inline-block; padding: 0.25rem 0.6rem; border-radius: 9999px; font-weight: bold; }
    .badge-success { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
  </style>
</head>
<body>
  <h1>⚡ Pre-Training Web App: Automated Test Runner</h1>
  <p>Requirements: CHK-01, CHK-02, CHK-03, CHK-04</p>
  <div class="card">
    <h3>Test Execution Output:</h3>
    <pre id="output">Running tests...</pre>
  </div>
  <!-- Hidden fixtures for DOM testing in browser -->
  <div style="display:none;" id="test-dom-fixtures">
    <div id="container-course-ai"></div>
    <div id="container-course-word"></div>
    <div id="container-pretraining"></div>
    <div id="container-liveclass"></div>
    <div id="nav-group-pretraining"></div>
    <div id="nav-group-liveclass"></div>
    <div id="nav-group-word"></div>
    <span id="header-brand-title"></span>
    <span id="header-brand-subtitle"></span>
    <div id="header-progress-text"></div>
    <div id="header-progress-bar"></div>
    <div id="stat-progress-count"></div>
    <div id="sec-word-intro"></div>
    <div id="sec-word-standards"></div>
    <div id="sec-word-shortcuts"></div>
    <div id="sec-word-module-2"></div>
    <div id="sec-word-cp-1"></div>
    <div id="sec-word-module-3"></div>
    <div id="sec-word-cp-2"></div>
    <div id="sec-word-diagnosis"></div>
    <div id="card-word-cp-1" class="checkpoint-gate-card">
      <span id="status-card-word-cp1"></span>
      <button class="btn-cp-action" data-checkpoint="word-cp-1" data-status="passed"></button>
      <button class="btn-cp-action" data-checkpoint="word-cp-1" data-status="failed"></button>
      <button class="btn-cp-action" data-checkpoint="word-cp-1" data-status="pending"></button>
    </div>
    <div id="card-word-cp-2" class="checkpoint-gate-card">
      <span id="status-card-word-cp2"></span>
      <button class="btn-cp-action" data-checkpoint="word-cp-2" data-status="passed"></button>
      <button class="btn-cp-action" data-checkpoint="word-cp-2" data-status="failed"></button>
      <button class="btn-cp-action" data-checkpoint="word-cp-2" data-status="pending"></button>
    </div>
    <span id="status-nav-word-cp1"></span>
    <span id="status-nav-word-cp2"></span>
    <span id="badge-nav-word-b1"></span>
    <span id="badge-nav-word-b2"></span>
    <span id="badge-nav-word-b3"></span>
    <button class="mode-tab" data-mode="pretraining"></button>
    <button class="mode-tab" data-mode="live-class"></button>
  </div>
  <script src="../assets/js/state.js"></script>
  <script src="../assets/js/search.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    // Intercept console.log to output pre
    const out = document.getElementById('output');
    out.innerText = '';
    const log = console.log;
    const err = console.error;
    console.log = function(...args) {
      log(...args);
      out.innerText += args.join(' ') + '\n';
    };
    console.error = function(...args) {
      err(...args);
      out.innerText += 'ERROR: ' + args.join(' ') + '\n';
    };
  </script>
  <script src="checkpoint-engine.test.js"></script>
  <script src="troubleshooting-exporter.test.js"></script>
  <script src="search-security.test.js"></script>
  <script src="mobile-accessibility.test.js"></script>
  <script src="mode-switcher.test.js"></script>
  <script src="live-class-modules.test.js"></script>
  <script src="multi-course.test.js"></script>
  <script src="word-modules.test.js"></script>
</body>
</html>
