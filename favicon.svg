<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Robot Ear Antennas / Bolts -->
  <rect x="7" y="27" width="4" height="14" rx="2" fill="#6366f1" />
  <rect x="53" y="27" width="4" height="14" rx="2" fill="#06b6d4" />

  <!-- Top Antenna with Glowing Core -->
  <line x1="32" y1="8" x2="32" y2="14" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="32" cy="7" r="3.5" fill="#38bdf8" filter="url(#glow)" />

  <!-- Robot + Calendar Head Outer Body -->
  <rect x="11" y="14" width="42" height="40" rx="9" fill="#1e293b" stroke="url(#accent)" stroke-width="2" />

  <!-- Calendar Top Rings / Clips -->
  <rect x="20" y="11" width="5" height="7" rx="2.5" fill="#e2e8f0" />
  <rect x="39" y="11" width="5" height="7" rx="2.5" fill="#e2e8f0" />

  <!-- Calendar Top Banner -->
  <path d="M12 24.5 h40" stroke="url(#headerGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Glowing Robot AI Eyes (Visor Shape) -->
  <rect x="18" y="30" width="10" height="7" rx="3.5" fill="#38bdf8" filter="url(#glow)" />
  <rect x="36" y="30" width="10" height="7" rx="3.5" fill="#38bdf8" filter="url(#glow)" />

  <!-- Calendar Agenda Dots / AI Status Indicator Grid -->
  <circle cx="21" cy="45" r="2.2" fill="#38bdf8" />
  <circle cx="28" cy="45" r="2.2" fill="#818cf8" />
  <circle cx="35" cy="45" r="2.2" fill="#a855f7" />
  <circle cx="42" cy="45" r="2.2" fill="#22c55e" />
</svg>
