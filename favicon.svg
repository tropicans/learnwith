<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="gradL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="gradY" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- High-tech Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5" />

  <!-- Letter L (Architectural Foundation) -->
  <path d="M 17 14 L 17 46 C 17 49.5 20 51.5 23.5 51.5 L 47 51.5" fill="none" stroke="url(#gradL)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Letter Y (Dynamic Intelligence) -->
  <path d="M 28 20 L 36 30 L 47 15" fill="none" stroke="url(#gradY)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 36 30 L 36 43" fill="none" stroke="url(#gradY)" stroke-width="6" stroke-linecap="round" />

  <!-- AI Sparkle Core -->
  <path d="M 48 27 L 49.2 30.2 L 52.5 31.5 L 49.2 32.8 L 48 36 L 46.8 32.8 L 43.5 31.5 L 46.8 30.2 Z" fill="#38bdf8" filter="url(#glow)" />
</svg>
